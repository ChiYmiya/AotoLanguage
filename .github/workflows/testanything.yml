name: testAnything

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/testanything.yml"

jobs:
  testAnything:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{secrets.GEMINI_API_KEY}}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 输出node版本
        run: |
          node -v
          npm -v

      - name: 安装依赖
        run: |
          npm install

      - name: 运行测试脚本
        run: |
          npx tsx scripts/testanything.ts
